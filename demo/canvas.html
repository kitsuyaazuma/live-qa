<!doctype html>
<meta charset="utf-8">
<title>live-qa demo</title>
<style>
  /* Frames at their real size: a scaled iframe throws off where a click lands. */
  html, body { margin: 0; width: 1920px; height: 1080px; background: #0d1117; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; gap: 18px; padding-top: 26px;
         box-sizing: border-box; font: 600 13px ui-sans-serif, system-ui; }
  .phones { display: flex; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 32px; }
  .pane { position: relative; }
  .frame { overflow: hidden; }
  iframe { border: 0; display: block; }
  .phone .frame, .phone iframe { width: 390px; height: 844px; }
  .phone .frame { border-radius: 26px; box-shadow: 0 0 0 7px #21262d, 0 18px 44px rgba(0,0,0,.5); }
  .stage .frame, .stage iframe { width: 1090px; height: 640px; }
  .ops .frame, .ops iframe { width: 1090px; height: 360px; }
  .stage .frame, .ops .frame { border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,.5); }
  .tag { position: absolute; top: -21px; left: 5px; color: #8b949e; letter-spacing: .1em; }
</style>
<div class="phones">
  <div class="pane phone"><span class="tag">AUDIENCE A</span>
    <div class="frame"><iframe id="a" title="Audience A" src="__A__"></iframe></div></div>
  <div class="pane phone"><span class="tag">AUDIENCE B</span>
    <div class="frame"><iframe id="b" title="Audience B" src="__B__"></iframe></div></div>
</div>
<div class="col">
  <div class="pane stage"><span class="tag">PRESENT — THE SCREEN BEHIND THE SPEAKER</span>
    <div class="frame"><iframe id="s" title="Present" src="__S__"></iframe></div></div>
  <div class="pane ops"><span class="tag">OPERATOR</span>
    <div class="frame"><iframe id="o" title="Operator" src="__O__"></iframe></div></div>
</div>
