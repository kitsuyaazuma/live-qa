name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Read-only checks side by side; the two builds share dist/ and stay in order.
      - parallel:
          - name: Format/Lint
            run: pnpm exec biome ci .

          - name: Format (Markdown)
            run: pnpm exec prettier --check "**/*.md"

          - name: Typecheck
            run: pnpm run typecheck

          - name: Test
            run: pnpm test

      - name: Build (default)
        run: pnpm run build

      - name: Build (pek2026)
        run: pnpm run build
        env:
          BRANDING: pek2026
